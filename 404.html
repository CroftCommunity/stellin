<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stellin</title>
  <!-- Hash routing makes real 404s rare; this is a safety net back to the app. -->
  <meta http-equiv="refresh" content="0; url=./#/" />
  <script>location.replace('./#/' + (location.hash ? location.hash.slice(1) : ''));</script>
</head>
<body>
  <p>Redirecting to <a href="./#/">Stellin</a>…</p>
</body>
</html>
